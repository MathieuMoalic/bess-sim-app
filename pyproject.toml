[project]
name = "bess-sim-app"
version = "0.1.0"
description = "Physics-based BESS module thermal & degradation simulator (PyBaMM DFN + Streamlit)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=7.1.0",
    "pybamm>=23.9",
    "streamlit>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
